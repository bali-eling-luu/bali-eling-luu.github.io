<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Jenis Sampah — Bali Eling Luu</title>
    <meta name="description" content="Pengertian, contoh, dan cara menangani jenis sampah." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"] },
            colors: {
              primary: "#17803D",
              forest: "#14532D",
              deep: "#0F3D22",
              cream: "#F5F2EA",
              terra: "#D9A441",
              danger: "#D64545",
              ink: "#1E3A2A",
              muted: "#6B7A70",
              line: "#E3E7E1",
            },
          },
        },
      };
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { -webkit-font-smoothing: antialiased; }
      .shell { max-width: 460px; margin: 0 auto; min-height: 100vh; background: #fff; position: relative; }
      .has-nav { padding-bottom: 84px; }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>

  <body class="bg-line/60 font-sans text-ink antialiased">
    <div class="shell has-nav">
      <!-- ===== TOP BAR ===== -->
      <header class="sticky top-0 z-40 flex items-center justify-between border-b border-line bg-white px-4 py-3">
        <a href="panduan.html" aria-label="Kembali ke panduan" class="grid h-9 w-9 place-items-center rounded-full border border-line text-forest transition hover:border-primary">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <a href="index.html" class="flex items-center gap-2">
          <img src="assets/logo/logo-mark.png" alt="" aria-hidden="true" class="h-7 w-7 object-contain" />
          <span class="text-[13px] font-extrabold text-forest">Bali Eling Luu</span>
        </a>
        <button type="button" id="menuBtn" aria-label="Buka menu" aria-expanded="false" aria-controls="menuTop" class="grid h-9 w-9 place-items-center rounded-full border border-line text-forest transition hover:border-primary">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </header>

      <ul id="menuTop" class="hidden border-b border-line bg-white px-5 py-2 text-sm font-medium text-muted">
        <li><a class="block py-2.5" href="index.html">Beranda</a></li>
        <li><a class="block py-2.5" href="panduan.html">Panduan Sampah</a></li>
        <li><a class="block py-2.5" href="index.html#tips">Tips Lingkungan</a></li>
        <li><a class="block py-2.5" href="index.html#artikel">Artikel</a></li>
      </ul>

      <main class="px-5 pb-8 pt-6" id="isi">
        <div class="grid h-64 place-items-center text-sm text-muted">Memuat…</div>
      </main>

      <!-- ===== BOTTOM NAV ===== -->
      <nav class="fixed bottom-0 left-1/2 z-40 w-full max-w-[460px] -translate-x-1/2 border-t border-line bg-white/95 backdrop-blur" aria-label="Navigasi bawah">
        <ul class="grid grid-cols-4">
          <li><a href="index.html" class="flex flex-col items-center gap-1 py-3 text-[10px] font-semibold text-muted transition hover:text-primary"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Beranda</a></li>
          <li><a href="panduan.html" aria-current="page" class="flex flex-col items-center gap-1 py-3 text-[10px] font-bold text-primary"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Jenis Sampah</a></li>
          <li><a href="index.html#panduan" class="flex flex-col items-center gap-1 py-3 text-[10px] font-semibold text-muted transition hover:text-primary"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>Lokasi</a></li>
          <li><a href="index.html#tentang" class="flex flex-col items-center gap-1 py-3 text-[10px] font-semibold text-muted transition hover:text-primary"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>Profil</a></li>
        </ul>
      </nav>
    </div>

    <script src="data_sampah.js"></script>
    <script src="chat.js"></script>
    <script>
      document.getElementById("menuBtn").addEventListener("click", function () {
        var m = document.getElementById("menuTop");
        var open = m.classList.toggle("hidden") === false;
        this.setAttribute("aria-expanded", String(open));
      });

      var TOPIK_TERKAIT = {
        organik: "Cara memilah sampah di rumah",
        anorganik: "Mengurangi plastik",
        residu: "Bedanya residu dan B3",
        b3: "Kenapa B3 bahaya",
      };

      function esc(s) {
        return String(s).replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function ilustrasi(warna) {
        return (
          '<svg viewBox="0 0 320 120" class="h-full w-full" role="img" aria-label="Ilustrasi alam">' +
          '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="#0F3D22"/><stop offset="1" stop-color="' + warna + '"/>' +
          "</linearGradient></defs>" +
          '<rect width="320" height="120" fill="url(#sky)"/>' +
          '<circle cx="262" cy="34" r="16" fill="#D9A441" opacity=".9"/>' +
          '<path d="M0 96c34-26 58-26 92 0 30-30 60-30 96 0 34-24 62-24 132 0v24H0Z" fill="#17803D" opacity=".55"/>' +
          '<path d="M0 108c40-18 74-18 112 0 36-22 72-22 112 0 34-16 60-16 96 0v12H0Z" fill="#14532D" opacity=".8"/>' +
          '<path d="M52 92c0-14 8-22 16-22s16 8 16 22" fill="none" stroke="#0F3D22" stroke-width="3"/>' +
          "</svg>"
        );
      }

      function render(key) {
        var k = KATEGORI[key] || KATEGORI.anorganik;
        var isi = document.getElementById("isi");
        var judul = k.nama + " — Jenis Sampah";

        var contoh = (k.contoh || []).map(function (c) {
          return (
            '<li class="flex gap-2.5 text-[12.5px] leading-snug text-muted">' +
            '<span class="mt-0.5 grid h-[18px] w-[18px] shrink-0 place-items-center rounded-full bg-primary text-[9px] font-bold text-white">✓</span>' +
            "<span>" + esc(c) + "</span></li>"
          );
        }).join("");

        var langkah = (k.penanganan || []).map(function (p, i) {
          return (
            '<li class="flex gap-3">' +
            '<span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-primary/12 text-[11px] font-bold text-primary">' + (i + 1) + "</span>" +
            '<p class="pt-0.5 text-[12.5px] leading-relaxed text-muted">' + esc(p) + "</p></li>"
          );
        }).join("");

        var topik = TOPIK_TERKAIT[key];

        isi.innerHTML =
          '<span class="inline-flex items-center gap-1.5 rounded-full bg-primary/10 px-3 py-1.5 text-[11px] font-bold text-primary">' +
          '<span aria-hidden="true">' + k.ikon + "</span> Jenis Sampah</span>" +
          '<h1 class="mt-3 text-[26px] font-extrabold leading-tight tracking-tight text-forest">' + esc(judul) + "</h1>" +

          // Hero card
          '<div class="mt-5 overflow-hidden rounded-2xl shadow-lg shadow-forest/15">' +
          '<div class="h-28 w-full overflow-hidden">' + ilustrasi(k.warna) + "</div>" +
          '<div class="bg-forest px-5 py-4">' +
          '<h2 class="text-[16px] font-extrabold text-white">Apa Itu Sampah ' + esc(k.nama) + "?</h2>" +
          '<p class="mt-2 text-[12.5px] leading-relaxed text-white/85">' + esc(k.definisi) + "</p>" +
          "</div></div>" +

          // Contoh
          '<h2 class="mt-7 text-[16px] font-extrabold tracking-tight text-forest">Contoh Sampah ' + esc(k.nama) + ":</h2>" +
          '<ul class="mt-3 space-y-2">' + contoh + "</ul>" +

          // Penanganan
          '<h2 class="mt-7 text-[16px] font-extrabold tracking-tight text-forest">Cara Menanganinya</h2>' +
          '<ul class="mt-3 space-y-3">' + langkah + "</ul>" +

          // Peringatan
          (k.peringatan
            ? '<div class="mt-6 rounded-xl border border-danger/30 bg-danger/8 p-4">' +
              '<p class="text-[11px] font-bold uppercase tracking-wide text-danger">Perhatian</p>' +
              '<p class="mt-1 text-[12.5px] leading-relaxed text-muted">' + esc(k.peringatan) + "</p></div>"
            : "") +

          // Topik terkait
          (topik
            ? '<div class="mt-6 rounded-2xl border border-line bg-cream p-4">' +
              '<p class="text-[12.5px] font-bold text-forest">Baca juga</p>' +
              '<p class="mt-0.5 text-[11.5px] text-muted">Topik yang sering ditanyakan</p>' +
              '<button type="button" data-topik="' + esc(topik) + '" class="mt-3 rounded-xl bg-forest px-4 py-2.5 text-[12.5px] font-bold text-white transition hover:bg-primary active:scale-[0.99]">' +
              esc(topik) + "</button></div>"
            : "") +

          // CTA
          '<button type="button" id="ctaLokasi" class="mt-7 w-full rounded-xl bg-primary px-6 py-3.5 text-[14px] font-bold text-white shadow-lg shadow-primary/20 transition hover:bg-forest active:scale-[0.99]">' +
          "Cari Lokasi Pembuangan</button>" +

          '<a href="panduan.html" class="mt-4 block text-center text-[12.5px] font-semibold text-muted underline decoration-line underline-offset-4 hover:text-primary">Lihat panduan semua kategori</a>';

        document.title = judul + " — Bali Eling Luu";

        document.getElementById("ctaLokasi").addEventListener("click", function () {
          if (window.ElingChat) window.ElingChat.buka("Lokasi pembuangan " + k.nama + " terdekat");
        });

        var t = isi.querySelector("[data-topik]");
        if (t) {
          t.addEventListener("click", function () {
            if (window.ElingChat) window.ElingChat.buka(t.getAttribute("data-topik"));
          });
        }
      }

      var param = new URLSearchParams(location.search).get("jenis");
      if (!KATEGORI[param]) param = "anorganik";
      render(param);
    </script>
  </body>
</html>
